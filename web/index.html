<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <title>Pantalla</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <canvas id="screen"></canvas>
  <canvas id="cursor" hidden></canvas>
  <pre id="hud" hidden></pre>
  <div id="toast" role="status" hidden></div>
  <button id="fs-hint" class="fs-hint" type="button" hidden>Toca para ver a pantalla completa</button>

  <!-- Solo aparece mientras no hay imagen: conectando, pedir el código o avisar de un error.
       Todos los ajustes se eligen en el panel del ordenador. -->
  <section id="gate" class="overlay">
    <div class="card">
      <h1>Pantalla secundaria</h1>
      <p class="sub" id="host"></p>
      <p id="status" class="status">Conectando…</p>
      <p id="problem" class="warn" hidden></p>
      <form id="key-form" hidden>
        <label>Código de emparejamiento
          <input id="key" autocomplete="off" autocapitalize="characters" spellcheck="false"
                 placeholder="XXXX-XXXX" maxlength="9">
        </label>
        <button class="primary" type="submit">Conectar</button>
      </form>
      <button id="retry" class="primary" type="button" hidden>Volver a conectar</button>
    </div>
  </section>

  <script type="module" src="/viewer.js"></script>
</body>
</html>

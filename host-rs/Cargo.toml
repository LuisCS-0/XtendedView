[package]
name = "xtendedview"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Luis Corral Sieiro"]
description = "XtendedView: usa un móvil, una tablet u otro dispositivo con navegador como pantalla del ordenador (captura sin copias DDA + D3D11 y H.264 por QuickSync)"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
log = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["local-offset"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }

[dependencies.windows]
version = "0.61"
features = [
    "Devices_WiFiDirect",
    "Foundation",
    "Security_Credentials",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_MediaFoundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
]

[features]
# Versión del instalador: sin ventana de consola (icono junto al reloj, registro en archivo).
gui = []

[profile.release]
opt-level = 3
debug = 1

[build-dependencies]
embed-resource = "3.0.12"
